[flake8]
max-line-length = 99
exclude = **/migrations/*,venv

[tool:pytest]
DJANGO_SETTINGS_MODULE = oc_lettings_site.settings
python_files = tests.py
addopts = -v
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning

[coverage:run]
omit =
    */tests.py
    */migrations/*
    manage.py
    */apps.py
    */asgi.py
    */wsgi.py