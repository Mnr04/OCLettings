# GitHub Actions workflow for CI/CD pipeline
name: CI/CD Pipeline

on: [push, pull_request]

jobs:
  # Job 1: Run Linting and Tests
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint with Flake8
        run: flake8
      - name: Test with Pytest
        run: pytest --cov=. --cov-fail-under=80

  # Job 2: Build and Push Docker image (Only on master if tests pass)
  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: jrm76/oclettings:${{ github.sha }},jrm76/oclettings:latest

  # Job 3: Deploy to Render
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Trigger Render Deployment
        run: curl -f "${{ secrets.RENDER_DEPLOY_HOOK }}"